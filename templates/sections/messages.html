{% if messages %}
    {% for message in messages %}
        <div
            class="alert
            {% if message.tags == 'error' %}
                alert-danger
            {% elif message.tags == 'warning' %}
                alert-warning
            {% elif message.tags == 'success' %}
                alert-success
            {% elif message.tags == 'info' %}
                alert-info
            {% else %}
                alert-secondary
            {% endif %}
            alert-dismissible fade show"
            role="alert"
        >
            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Cerrar"
            ></button>
        </div>
    {% endfor %}
{% endif %}
