{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Admistración Catalogo en linea</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/menu.css' %}">
  <link rel="stylesheet" href="{% static 'css/tabs.css' %}">
</head>

<body>
  <div class="wrapper">
    <!-- Encabezado -->
    {% include "sections/head.html" %}
    <!-- Centro: menú lateral + contenedor -->
    <main>
      {% include "sections/navbar.html" %}

      <section>
         <div class="breadcrumb-container">
          {% include "sections/breadcrumbs.html" %}
        </div>
        {% block content %}
        <!-- Aquí se cargan las otras páginas -->
        {% endblock %}
      </section>
    </main>

    <!-- Pie de página -->
    <footer>
      <p>&copy; 2026 Digital Catalog - ERPNext Integration</p>
    </footer>
  </div>
  {% block extra_js %}{% endblock %}
</body>

</html>
