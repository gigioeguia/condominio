services:
  web:
    build: 
      context: .
      dockerfile: Docker.prod
    container_name: condominos
    ports:
      - "8000:8000"
    env_file: .env.prod
  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static:/static
    ports:
      - "80:80"
    depends_on:
      - web
