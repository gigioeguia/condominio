{% extends "sections/tab.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block import_content %}
<div class="container py-4">
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}        
    {% crispy form %}
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/forms.js' %}"></script>
{% endblock %}
