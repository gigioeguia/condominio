{% extends "sections/tab.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block import_content %}
<div class="container py-4">
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}        
    {% crispy form %}
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/forms.js' %}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const service = document.getElementById("id_service");
    const domain = document.getElementById("div_id_domain");

    function toggleDomain() {
        if (service.value === "") {
            domain.style.display = "";
        } else {
            domain.style.display = "none";
        }
    }

    service.addEventListener("change", toggleDomain);

    // Ejecutar al cargar la página
    toggleDomain();
});
</script>
{% endblock %}
